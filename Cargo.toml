[package]
name = "focustime"
version = "0.16.4"
edition = "2024"
rust-version = "1.85"
description = "TUI Pomodoro timer with site blocking and focus history"
license = "MIT"
readme = "README.md"
repository = "https://github.com/utilForever/focustime"
homepage = "https://github.com/utilForever/focustime"
keywords = ["pomodoro", "tui", "productivity", "focus"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
toml = "1.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "windows")'.dependencies]
winrt-toast-reborn = "0.3.8"
